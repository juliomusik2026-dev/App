<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F1A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Eigener Musik-Player: MP3s hochladen, Künstlerprofile anlegen, Playlists bauen.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plattenkiste">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Plattenkiste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  /* Layout: ein Spaltenlayout in Handybreite. Kopfzeile, scrollende Ansicht, Mini-Player, Tab-Leiste. Der große Player liegt als Overlay darüber, mit Plattenhülle und drehender Platte. */
  --bg:#EEF0F6;--surface:#FFFFFF;--surface-2:#E2E5F0;--fg:#131627;--muted:#5B6177;--line:#D2D7E4;
  --accent:#3A3FF0;--accent-fg:#FFFFFF;--danger:#C0392B;--danger-fg:#FFFFFF;
  --scrim:rgba(10,12,32,.5);--shadow:0 8px 28px rgba(14,18,60,.14);
  --font-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F1A;--surface:#171B2E;--surface-2:#222844;--fg:#ECEEF8;--muted:#99A0BA;--line:#2B3252;
    --accent:#8E94FF;--accent-fg:#0D0F1A;--danger:#FF8F7F;--danger-fg:#2B0C07;
    --scrim:rgba(0,0,0,.62);--shadow:0 8px 28px rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F1A;--surface:#171B2E;--surface-2:#222844;--fg:#ECEEF8;--muted:#99A0BA;--line:#2B3252;
  --accent:#8E94FF;--accent-fg:#0D0F1A;--danger:#FF8F7F;--danger-fg:#2B0C07;
  --scrim:rgba(0,0,0,.62);--shadow:0 8px 28px rgba(0,0,0,.45);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

#app{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;gap:8px;min-height:60px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font:700 17px/1 var(--font-display);letter-spacing:-.02em;margin-right:auto}
.top-title{font:700 15px/1.2 var(--font-display);letter-spacing:-.01em;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:16px;-webkit-overflow-scrolling:touch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:0;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-ghost{background:var(--surface-2);color:var(--fg)}
.btn-danger{background:var(--danger);color:var(--danger-fg)}
.btn-quiet{background:none;color:var(--muted);padding:0 10px}
.btn-quiet.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.wide{width:100%;height:48px}
.btn-row{display:flex;gap:10px;margin-top:14px}
.grow{flex:1}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.ic{display:block;flex:none}

.h1{font:700 22px/1.15 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 16px}
.muted,.hint{color:var(--muted)}
.hint{font-size:13px}
.pad{padding:16px 4px}
.body-p{color:var(--muted);line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 8px}
.toolbar .count{margin-left:auto;font-size:12.5px;color:var(--muted)}
.sortbtn{background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 4px;display:inline-flex;align-items:center;gap:6px}
.sortbtn:hover{color:var(--fg)}

.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:42px;background:var(--surface)}
.search.sm input{background:var(--bg)}
.input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 14px;font:inherit;font-size:16px}
.input.sm{height:40px;font-size:15px;padding:0 12px}
textarea.input{height:auto;padding:12px 14px;resize:vertical;line-height:1.45}
.input::placeholder{color:var(--muted);opacity:.8}

/* Listen */
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 4px;border-radius:12px;cursor:pointer;background:none;border:0;text-align:left;color:inherit;font:inherit}
.row.pl{grid-template-columns:56px minmax(0,1fr) auto}
.row:active{background:var(--surface-2)}
@media (hover:hover){.row:hover{background:var(--surface)}}
.meta{min-width:0}
.meta .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.playing .t{color:var(--accent)}
.cover{position:relative;width:48px;height:48px;flex:none;border-radius:8px;overflow:hidden;background-size:cover;background-position:center;display:grid;place-items:center;color:rgba(255,255,255,.9);font:700 18px/1 var(--font-display)}
.eq{display:none;position:absolute;inset:0;background:rgba(8,10,26,.55);align-items:center;justify-content:center;gap:3px}
.eq b{display:block;width:3px;height:16px;border-radius:2px;background:#fff;transform-origin:50% 100%;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:-.3s}
.eq b:nth-child(3){animation-delay:-.6s}
.playing>.cover .eq{display:flex}
body.is-paused .eq b{animation-play-state:paused}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.note strong{font-family:var(--font-display);font-size:13px;letter-spacing:-.01em}
.note span{color:var(--muted);font-size:14px}
.note .btn-row{margin-top:8px;flex-wrap:wrap}
.note.warn{border-color:var(--danger)}

.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px 4px}
.empty h2{font:700 20px/1.2 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.empty p{color:var(--muted);max-width:44ch}
.empty svg.big-disc{margin-bottom:6px}

/* Künstler */
.artist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:22px 14px}
.artist-card{background:none;border:0;padding:0;text-align:center;display:flex;flex-direction:column;gap:8px;min-width:0}
.artist-card .an{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist-card .as{font-size:13px;color:var(--muted);margin-top:-6px}
.avatar{width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;color:rgba(255,255,255,.92);font:700 34px/1 var(--font-display);flex:none}
.avatar.big{width:104px;font-size:36px}
.avatar.sm{width:72px;font-size:26px}
.hero{display:flex;align-items:center;gap:16px;margin:4px 0 12px}
.hero-info{min-width:0;display:flex;flex-direction:column;gap:4px}
.hero-info .s{color:var(--muted);font-size:14px}
.bio{color:var(--muted);white-space:pre-line;margin:0 0 4px;max-width:60ch}

.mosaic{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;background-size:cover;background-position:center;display:grid;place-items:center;color:rgba(255,255,255,.92);flex:none}
.mosaic.big{width:104px;height:104px;border-radius:14px}
.mosaic.four{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mosaic.four i{display:block;background-size:cover;background-position:center}

/* Tab-Leiste und Mini-Player */
#tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:4px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent)}
#mini{position:relative;flex:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 8px 8px 8px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;--pp:0%}
#mini .cover{width:44px;height:44px}
#mini .bar{position:absolute;left:0;bottom:0;height:3px;width:var(--pp);background:var(--accent)}
.mini-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}

/* Sheets */
#sheet-backdrop{position:fixed;inset:0;z-index:40;background:var(--scrim)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:680px;margin:0 auto;max-height:88%;display:flex;flex-direction:column;background:var(--surface);color:var(--fg);border-radius:22px 22px 0 0;
  padding:8px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sheetin .22s ease-out;outline:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px}
.sheet-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.sheet-titles{flex:1;min-width:0}
.sheet-title{font:700 17px/1.25 var(--font-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.sheet-sub{color:var(--muted);font-size:13px;margin-top:2px}
.sheet-body{overflow-y:auto;min-height:0;overscroll-behavior:contain}
.sticky-foot{position:sticky;bottom:0;background:var(--surface);padding-top:10px}
@keyframes sheetin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:13px 6px;border:0;background:none;text-align:left;font-weight:500;border-radius:10px;color:var(--fg)}
.menu-item:active{background:var(--surface-2)}
.menu-item .ic{color:var(--muted)}
.menu-item.danger,.menu-item.danger .ic{color:var(--danger)}
.form{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:30px 20px;border:2px dashed var(--line);border-radius:18px;cursor:pointer;color:var(--muted)}
.drop .ic{color:var(--accent)}
.drop strong{color:var(--fg);font-size:16px}
.drop span{font-size:13.5px;max-width:34ch}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.progress-box{display:flex;align-items:center;gap:14px;padding:26px 6px;color:var(--muted)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.up-list{display:flex;flex-direction:column;gap:12px;margin:6px 0}
.up-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.up-row .cover{width:44px;height:44px}
.up-fields{display:flex;flex-direction:column;gap:6px;min-width:0}
.photo-row{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.photo-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline-create{display:flex;gap:8px;margin-bottom:12px}
.inline-create .input{flex:1;min-width:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--accent-fg)}
.row.sel .chk{background:var(--accent);border-color:var(--accent)}
.steps{margin:4px 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.steps li::marker{color:var(--accent);font-weight:700}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,10px);max-width:min(90vw,420px);z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Großer Player */
#player{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background-color:var(--bg);background-image:linear-gradient(180deg,hsl(var(--h,230) 75% 55% / .30),transparent 62%);
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;animation:up .26s ease-out}
.pl-inner{width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;gap:16px}
.pl-top{display:flex;align-items:center;justify-content:space-between}
.pl-top .eyebrow{text-align:center}
.stage-wrap{flex:1;display:grid;place-items:center;min-height:150px}
.stage{position:relative;width:min(100%,58vh,440px);aspect-ratio:1.389}
.sleeve{position:absolute;left:0;top:0;width:72%;aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;display:grid;place-items:center;color:rgba(255,255,255,.9);font:700 clamp(30px,9vw,54px)/1 var(--font-display);box-shadow:0 18px 40px rgba(8,10,40,.38);z-index:2}
.disc{position:absolute;left:28%;top:0;width:72%;aspect-ratio:1;border-radius:50%;z-index:1;
  background:
    conic-gradient(from 0deg,transparent 0 18%,rgba(255,255,255,.16) 24%,transparent 30% 68%,rgba(255,255,255,.16) 74%,transparent 80%),
    radial-gradient(circle,#07070b 0 2.5%,hsl(var(--h,230) 78% 58%) 3% 24%,transparent 24.5%),
    repeating-radial-gradient(circle,#101016 0 2px,#1b1b24 2px 3px);
  box-shadow:0 10px 30px rgba(8,10,40,.3);animation:spin 5s linear infinite;animation-play-state:paused}
#player.is-playing .disc{animation-play-state:running}
.pl-meta{display:flex;align-items:center;gap:8px}
.pl-titles{flex:1;min-width:0}
#pl-title{font:700 21px/1.2 var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
#pl-artist{background:none;border:0;padding:0;color:var(--muted);font-size:15px;text-align:left;margin-top:4px}
#pl-artist[data-id]:hover{color:var(--fg);text-decoration:underline}
.seek{display:flex;flex-direction:column;gap:6px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);border:0;margin-top:-6px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:0}
.controls{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:380px;margin:0 auto}
.ctl{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:none;border:0;color:var(--fg)}
.ctl.on{color:var(--accent)}
.ctl.on::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor}
.ctl.big{width:72px;height:72px;background:var(--accent);color:var(--accent-fg)}
.pl-foot{display:flex;justify-content:center}

@media (prefers-reduced-motion:reduce){
  .disc,.eq b,.spinner{animation:none}
  #sheet,#player{animation:none}
  #toast{transition:none}
}
</style>

</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view" tabindex="-1"><div class="progress-box"><div class="spinner"></div><span>Bibliothek wird geladen</span></div></main>
  <div id="mini" hidden data-action="mini-open">
    <div id="mini-cover"></div>
    <div class="meta"><div class="t" id="mini-title"></div><div class="s" id="mini-artist"></div></div>
    <button class="mini-btn" id="mini-play" data-action="p-toggle" aria-label="Abspielen oder pausieren"></button>
    <div class="bar"></div>
  </div>
  <nav id="tabs" aria-label="Bereiche"></nav>
</div>

<div id="player" hidden>
  <div class="pl-inner">
    <div class="pl-top">
      <button class="icon-btn" data-action="player-close" aria-label="Player schließen"></button>
      <div class="eyebrow">Läuft gerade</div>
      <button class="icon-btn" data-action="p-output" aria-label="Bluetooth und Ausgabe"></button>
    </div>
    <div class="stage-wrap">
      <div class="stage"><div class="disc" id="pl-disc"></div><div class="sleeve" id="pl-sleeve"></div></div>
    </div>
    <div class="pl-meta">
      <div class="pl-titles"><div id="pl-title"></div><button id="pl-artist" data-action="p-artist"></button></div>
      <button class="icon-btn" data-action="p-addpl" aria-label="Zu Playlist hinzufügen" id="pl-add"></button>
    </div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="0" step="any" value="0" aria-label="Position im Titel">
      <div class="times mono"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
    </div>
    <div class="controls">
      <button class="ctl" id="pl-shuffle" data-action="p-shuffle" aria-label="Zufallswiedergabe" aria-pressed="false"></button>
      <button class="ctl" data-action="p-prev" aria-label="Vorheriger Titel" id="pl-prev"></button>
      <button class="ctl big" id="pl-play" data-action="p-toggle" aria-label="Abspielen oder pausieren"></button>
      <button class="ctl" data-action="p-next" aria-label="Nächster Titel" id="pl-next"></button>
      <button class="ctl" id="pl-repeat" data-action="p-repeat" aria-label="Wiederholen" aria-pressed="false"></button>
    </div>
    <div class="pl-foot"><button class="btn btn-ghost" data-action="p-output" id="pl-out"></button></div>
  </div>
</div>

<div id="sheet-backdrop" hidden data-action="sheet-close"></div>
<div id="sheet" role="dialog" aria-modal="true" tabindex="-1" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="auto"></audio>

<script>
(function(){
'use strict';

/* ---------- Helfer ---------- */
const $=(s,r=document)=>r.querySelector(s);

/* ---------- Generierte Cover ---------- */
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function genBg(seed){
  const h=hash(seed),h1=h%360,h2=(h1+50+((h>>>8)%70))%360,x=15+((h>>>12)%70),y=15+((h>>>18)%70),ang=(h>>>4)%360;
  return 'radial-gradient(circle at '+x+'% '+y+'%,hsl('+h2+' 90% 68%) 0 22%,transparent 22.5%),linear-gradient('+ang+'deg,hsl('+h1+' 72% 48%),hsl('+h2+' 68% 30%))';
}
const seedOf=t=>(t.title||'')+(t.artistId||'');
const hueOf=t=>hash(seedOf(t))%360;
function coverStyle(t){return t.cover?"background-image:url('"+t.cover+"')":'background:'+genBg(seedOf(t));}
function coverHTML(t){
  return '<div class="cover" style="'+coverStyle(t)+'">'+(t.cover?'':'<span>'+esc(initial(t.title))+'</span>')+'<i class="eq" aria-hidden="true"><b></b><b></b><b></b></i></div>';
}
function avatarHTML(a,cls){

  return '<div class="avatar '+(cls||'')+'" style="'+st+'">'+(a.photo?'':esc(initial(a.name)))+'</div>';
}
function mosaicHTML(ids,seed,cls){
  const ts=ids.map(i=>T.get(i)).filter(Boolean);
  if(ts.length>=4){return '<div class="mosaic four '+(cls||'')+'">'+ts.slice(0,4).map(t=>'<i style="'+coverStyle(t)+'"></i>').join('')+'</div>';}
  if(ts.length){return '<div class="mosaic '+(cls||'')+'" style="'+coverStyle(ts[0])+'"></div>';}
  return '<div class="mosaic '+(cls||'')+'" style="background:'+genBg(seed)+'">'+icon('list',cls?36:24)+'</div>';
}

/* ---------- Speicher (IndexedDB mit Notfall-Variante im Arbeitsspeicher) ---------- */
const STORES=['tracks','audio','artists','playlists','meta'];
let idb=null,memMode=false;
const mem={};STORES.forEach(s=>{mem[s]=new Map();});
function openDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('no idb'));return;}
    let req;try{req=indexedDB.open('plattenkiste',1);}catch(e){rej(e);return;}
    req.onupgradeneeded=()=>{const db=req.result;STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:s==='meta'?'k':'id'});});};
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error||new Error('idb error'));
    req.onblocked=()=>rej(new Error('blocked'));
    setTimeout(()=>rej(new Error('timeout')),4000);
  });
}
const store={
  all(s){
    if(memMode)return Promise.resolve([...mem[s].values()]);
    return new Promise((res,rej)=>{const r=idb.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  },
  get(s,id){
    if(memMode)return Promise.resolve(mem[s].get(id));
    return new Promise((res,rej)=>{const r=idb.transaction(s).objectStore(s).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  },
  put(s,v){
    if(memMode){mem[s].set(s==='meta'?v.k:v.id,v);return Promise.resolve();}
    return new Promise((res,rej)=>{const tx=idb.transaction(s,'readwrite');tx.objectStore(s).put(v);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abort'));});
  },
  del(s,id){
    if(memMode){mem[s].delete(id);return Promise.resolve();}
    return new Promise((res,rej)=>{const tx=idb.transaction(s,'readwrite');tx.objectStore(s).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('abort'));});
  }
};
const saveErr=e=>{toast(e&&e.name==='QuotaExceededError'?'Nicht genug Speicherplatz auf dem Gerät.':'Speichern hat nicht geklappt.');};

/* ---------- Demo-Töne (kurze Beispielstücke, direkt im Browser erzeugt) ---------- */
function wavBytes(f32,sr){
  const n=f32.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,f32[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);}
  return buf;
}
function synthDemo(o){
  const sr=22050,n=Math.floor(sr*o.seconds),out=new Float32Array(n),step=60/o.bpm/2,pat=[0,1,2,1,3,2,1,2],steps=Math.floor(o.seconds/step);
  for(let i=0;i<steps;i++){
    const ch=o.chords[Math.floor(i/8)%o.chords.length],f=ch[pat[i%8]],s0=Math.floor(i*step*sr),len=Math.floor(step*1.8*sr);
    for(let k=0;k<len&&s0+k<n;k++){const t=k/sr,env=Math.min(1,t/0.006)*Math.exp(-5*t);out[s0+k]+=0.34*env*o.wave(2*Math.PI*f*t);}
    if(i%8===0){const b=ch[0]/2,bl=Math.floor(step*7.6*sr);for(let k=0;k<bl&&s0+k<n;k++){const t=k/sr,env=Math.min(1,t/0.02)*Math.exp(-1.1*t);out[s0+k]+=0.3*env*Math.sin(2*Math.PI*b*t);}}
  }
  let peak=0;for(let i=0;i<n;i++)peak=Math.max(peak,Math.abs(out[i]));
  const g=peak?0.8/peak:1,fade=Math.floor(sr*1.5);
  for(let i=0;i<n;i++){out[i]*=g;if(i>n-fade)out[i]*=(n-i)/fade;}
  return wavBytes(out,sr);
}

/* ---------- ID3-Tags lesen (Titel, Künstler, Album, Cover) ---------- */
function unsync(u8){const out=new Uint8Array(u8.length);let j=0;for(let i=0;i<u8.length;i++){out[j++]=u8[i];if(u8[i]===0xFF&&u8[i+1]===0x00)i++;}return out.subarray(0,j);}
function decodeText(enc,bytes){
  try{
    let s;
    if(enc===0)s=new TextDecoder('windows-1252').decode(bytes);
    else if(enc===1){
      if(bytes[0]===0xFF&&bytes[1]===0xFE)s=new TextDecoder('utf-16le').decode(bytes.subarray(2));
      else if(bytes[0]===0xFE&&bytes[1]===0xFF)s=new TextDecoder('utf-16be').decode(bytes.subarray(2));
      else s=new TextDecoder('utf-16le').decode(bytes);
    }
    else if(enc===2)s=new TextDecoder('utf-16be').decode(bytes);
    else s=new TextDecoder('utf-8').decode(bytes);
    return s.split('\u0000').map(x=>x.trim()).filter(Boolean).join(', ');
  }catch(e){return '';}
}
async function readTags(file){
  const out={title:'',artist:'',album:'',cover:null};
  try{
    if(!(/\.mp3$/i.test(file.name)||file.type==='audio/mpeg'))return out;
    const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(!(head[0]===0x49&&head[1]===0x44&&head[2]===0x33&&(head[3]===3||head[3]===4)))return out;
    const ver=head[3],flags=head[5],size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9],total=Math.min(size,20*1024*1024);
    let buf=new Uint8Array(await file.slice(10,10+total).arrayBuffer());
    if(ver===3&&(flags&0x80))buf=unsync(buf);
    let p=0;
    if(flags&0x40){p=ver===4?((buf[0]<<21)|(buf[1]<<14)|(buf[2]<<7)|buf[3]):(((buf[0]<<24)|(buf[1]<<16)|(buf[2]<<8)|buf[3])>>>0)+4;}
    let picBytes=null,picMime='';
    while(p+10<=buf.length){
      const id=String.fromCharCode(buf[p],buf[p+1],buf[p+2],buf[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id))break;
      const fs=ver===4?((buf[p+4]<<21)|(buf[p+5]<<14)|(buf[p+6]<<7)|buf[p+7]):(((buf[p+4]<<24)|(buf[p+5]<<16)|(buf[p+6]<<8)|buf[p+7])>>>0);
      const ff=buf[p+9];
      let data=buf.subarray(p+10,p+10+fs);
      p+=10+fs;
      if(fs<=0)continue;
      let skip=false;
      if(ver===4){if(ff&0x0C)skip=true;else{if(ff&0x01)data=data.subarray(4);if(ff&0x02)data=unsync(data);}}
      else{if(ff&0xC0)skip=true;else if(ff&0x20)data=data.subarray(1);}
      if(skip)continue;
      if(id==='TIT2'&&!out.title)out.title=decodeText(data[0],data.subarray(1));
      else if(id==='TPE1'&&!out.artist)out.artist=decodeText(data[0],data.subarray(1));
      else if(id==='TPE2'&&!out.artist2)out.artist2=decodeText(data[0],data.subarray(1));
      else if(id==='TALB'&&!out.album)out.album=decodeText(data[0],data.subarray(1));
      else if(id==='APIC'&&!picBytes){
        const enc=data[0];let q=1;
        while(q<data.length&&data[q]!==0)q++;
        picMime=String.fromCharCode.apply(null,data.subarray(1,q));q++;q++;
        if(enc===0||enc===3){while(q<data.length&&data[q]!==0)q++;q++;}
        else{while(q+1<data.length&&!(data[q]===0&&data[q+1]===0))q+=2;q+=2;}
        picBytes=data.subarray(q);
      }
    }
    if(!out.artist&&out.artist2)out.artist=out.artist2;
    if(picBytes&&picBytes.length>100){
      const type=picBytes[0]===0x89?'image/png':picBytes[0]===0xFF?'image/jpeg':(/^image\//.test(picMime)?picMime:'image/jpeg');
      out.cover=await imgToDataURL(new Blob([picBytes],{type:type}),320);
    }
  }catch(e){}
  return out;
}
async function imgToDataURL(blob,size){
  const url=URL.createObjectURL(blob);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url;});
    const s=Math.min(img.naturalWidth,img.naturalHeight);if(!s)return null;
    const c=document.createElement('canvas');c.width=c.height=Math.min(size,s);
    c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.8);
  }catch(e){return null;}
  finally{URL.revokeObjectURL(url);}
}
function guessFromName(name){
  const base=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').replace(/^\d{1,3}[\s.\-_]+(?=\D)/,'').trim();
  const m=base.match(/^(.+?)\s+-\s+(.+)$/);
  return m?{artist:m[1].trim(),title:m[2].trim()}:{artist:'',title:base};
}
function getDuration(file){
  return new Promise(res=>{
    const a=new Audio();a.preload='metadata';const u=URL.createObjectURL(file);
    const done=v=>{URL.revokeObjectURL(u);a.removeAttribute('src');res(isFinite(v)&&v>0?v:0);};
    a.onloadedmetadata=()=>done(a.duration);a.onerror=()=>done(0);setTimeout(()=>done(0),6000);a.src=u;
  });
}

const sheetEl=$('#sheet'),backdrop=$('#sheet-backdrop');

function setSheetBody(html,mount){

function closeSheet(){

/* ---------- Upload ---------- */
let pending=[];
const isAudio=f=>/^audio\//.test(f.type)||/\.(mp3|m4a|aac|wav|ogg|oga|flac|opus)$/i.test(f.name);
const fpOf=f=>f.name+'|'+f.size;
function openUpload(){
  openSheet({title:'MP3 hochladen',html:'<label class="drop" for="file-input">'+icon('upload',30)+'<strong>MP3-Dateien auswählen</strong><span>Mehrere Dateien auf einmal sind möglich. Titel, Künstler und Cover werden aus den Dateien gelesen. Die Musik bleibt auf diesem Gerät.</span></label><input id="file-input" class="vh" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" multiple>',
    mount:b=>{$('#file-input',b).addEventListener('change',e=>{const fl=[...e.target.files];e.target.value='';handleFiles(fl);});}});
}
async function handleFiles(list){
  const files=list.filter(isAudio);
  if(!files.length){toast('Keine Audio-Dateien gefunden.');return;}
  const have=new Set([...T.values()].map(t=>t.fp).filter(Boolean));
  const seen=new Set(),fresh=[];
  files.forEach(f=>{const k=fpOf(f);if(!have.has(k)&&!seen.has(k)){seen.add(k);fresh.push(f);}});
  if(!fresh.length){toast('Diese Titel sind schon in deiner Bibliothek.');return;}
  const skipped=files.length-fresh.length;
  openSheet({title:'MP3 hochladen',html:'<div class="progress-box"><div class="spinner"></div><span id="up-prog">Datei-Infos werden gelesen</span></div>'});
  pending=[];
  for(let i=0;i<fresh.length;i++){
    const f=fresh[i],pr=$('#up-prog');
    if(pr)pr.textContent='Datei-Infos werden gelesen ('+(i+1)+' von '+fresh.length+')';
    const tg=await readTags(f),g=guessFromName(f.name);
    pending.push({file:f,fp:fpOf(f),title:tg.title||g.title||f.name,artist:tg.artist||g.artist||'',album:tg.album||'',cover:tg.cover||null});
  }
  renderReview(skipped);
}
function renderReview(skipped){
  if(sheetEl.hidden)return;
  if(!pending.length){setSheetBody('<p class="muted pad">Keine Titel zum Hinzufügen.</p>');return;}
  const rows=pending.map((p,i)=>'<div class="up-row" data-i="'+i+'"><div class="cover" style="'+coverStyle({title:p.title,artistId:p.artist,cover:p.cover})+'">'+(p.cover?'':'<span>'+esc(initial(p.title))+'</span>')+'</div>'
    +'<div class="up-fields"><input class="input sm" id="up-t-'+i+'" data-f="title" value="'+esc(p.title)+'" aria-label="Titel" maxlength="200"><input class="input sm" id="up-a-'+i+'" data-f="artist" list="artist-list" value="'+esc(p.artist)+'" placeholder="Künstler" aria-label="Künstler" maxlength="120" autocomplete="off"></div>'
    +'<button class="icon-btn" data-rm="'+i+'" aria-label="Aus der Auswahl entfernen" type="button">'+icon('close',18)+'</button></div>').join('');
  setSheetBody('<div class="form"><p class="hint">Prüfe die Angaben. Ein neuer Künstlername legt automatisch ein Künstlerprofil an.'+(skipped?' '+skipped+' schon vorhandene Datei'+(skipped===1?' wurde':'en wurden')+' übersprungen.':'')+'</p>'
    +'<label class="lbl" for="up-all">Künstler für alle Titel (optional)</label><input class="input" id="up-all" list="artist-list" placeholder="Name eingeben oder wählen" maxlength="120" autocomplete="off">'
    +'<div class="up-list">'+rows+'</div>'
    +'<div class="sticky-foot"><button class="btn btn-primary wide" id="up-save" type="button">'+pending.length+(pending.length===1?' Titel':' Titel')+' hinzufügen</button></div></div>'+artistDatalist(),
  b=>{
    b.addEventListener('input',e=>{
      const el=e.target;
      if(el.id==='up-all'){const v=el.value;pending.forEach((p,i)=>{p.artist=v;const inp=$('#up-a-'+i,b);if(inp)inp.value=v;});return;}
      const row=el.closest('.up-row');if(!row||!el.dataset.f)return;
      pending[+row.dataset.i][el.dataset.f]=el.value;
    });
    b.addEventListener('click',e=>{
      const rm=e.target.closest('[data-rm]');
      if(rm){pending.splice(+rm.dataset.rm,1);if(!pending.length){openUpload();return;}renderReview(0);return;}
      if(e.target.closest('#up-save'))saveUploads();
    });
  });
}
async function saveUploads(){
  const btn=$('#up-save');if(btn)btn.disabled=true;
  const total=pending.length;let ok=0,failed=0,quota=false;
  for(let i=0;i<total;i++){
    const p=pending[i],b=$('#up-save');
    if(b)b.textContent='Speichere '+(i+1)+' von '+total+'…';
    try{
      const buf=await p.file.arrayBuffer(),dur=await getDuration(p.file),ar=await ensureArtist(p.artist);
      const t={id:uid(),title:(p.title||'').trim()||p.file.name,artistId:ar?ar.id:null,album:p.album||'',duration:dur,cover:p.cover||null,addedAt:Date.now()+i,size:p.file.size,type:p.file.type||'audio/mpeg',fileName:p.file.name,fp:p.fp};
      await store.put('audio',{id:t.id,buf:buf,type:t.type});
      await store.put('tracks',t);T.set(t.id,t);ok++;
    }catch(e){failed++;if(e&&e.name==='QuotaExceededError')quota=true;}
  }
  pending=[];closeSheet();
  nav={tab:'songs',detail:null};query='';render();
  if(failed)toast(quota?'Nicht genug Speicherplatz. '+ok+' von '+total+' Titeln gespeichert.':ok+' von '+total+' Titeln gespeichert, '+failed+' ohne Erfolg.');
  else toast(ok===1?'1 Titel hinzugefügt.':ok+' Titel hinzugefügt.');
}
['dragover','drop'].forEach(ev=>window.addEventListener(ev,e=>{
  if(!e.dataTransfer||![...(e.dataTransfer.types||[])].includes('Files'))return;
  e.preventDefault();
  if(ev==='drop')handleFiles([...e.dataTransfer.files]);
}));

function openPicker(o){

  const body=openSheet({title:o.title,sub:o.sub,html:'<div class="search sm">'+icon('search',18)+'<input class="input sm" id="pk-q" type="search" placeholder="Suchen" autocomplete="off" aria-label="Suchen"></div><div id="pk-list" style="margin-top:8px"></div><div class="sticky-foot"><button class="btn btn-primary wide" id="pk-ok" type="button" disabled>'+esc(o.confirm)+'</button></div>'});

    const ql=q.trim().toLowerCase();
    const rows=o.tracks.filter(t=>!ql||(t.title+' '+artistName(t)).toLowerCase().includes(ql));
    list.innerHTML=rows.length?rows.map(t=>'<button class="row'+(sel.has(t.id)?' sel':'')+'" data-id="'+t.id+'" type="button">'+coverHTML(t)+'<div class="meta"><div class="t">'+esc(t.title)+'</div><div class="s">'+esc(artistName(t)||'Kein Künstler')+'</div></div><span class="chk">'+(sel.has(t.id)?icon('check',16):'')+'</span></button>').join(''):'<p class="muted pad">Keine Titel gefunden.</p>';
    ok.disabled=!sel.size;ok.textContent=sel.size?o.confirm+' ('+sel.size+')':o.confirm;
  };
  draw();
  $('#pk-q',body).addEventListener('input',e=>{q=e.target.value;draw();});
  list.addEventListener('click',e=>{const r=e.target.closest('[data-id]');if(!r)return;const id=r.dataset.id;if(sel.has(id))sel.delete(id);else sel.add(id);draw();});
  ok.addEventListener('click',()=>{const ids=[...sel];closeSheet();o.onDone(ids);});
}

/* ---------- Playlists ---------- */
function openPlaylistForm(id){
  const p=id?PL.get(id):null;
  openSheet({title:p?'Playlist bearbeiten':'Neue Playlist',html:'<div class="form"><label class="lbl" for="p-name">Name</label><input class="input" id="p-name" maxlength="80" autocomplete="off" placeholder="Zum Beispiel Autofahrt">'
    +'<div class="btn-row"><button class="btn btn-primary wide" id="p-save" type="button">'+(p?'Speichern':'Playlist erstellen')+'</button></div>'+(p?'<button class="btn btn-quiet danger" id="p-del" type="button">Playlist löschen</button>':'')+'</div>',
    mount:b=>{
      const nm=$('#p-name',b);nm.value=p?p.name:'';
      $('#p-save',b).onclick=async()=>{
        const name=nm.value.trim();if(!name){toast('Bitte einen Namen eingeben.');nm.focus();return;}
        try{
          if(p){p.name=name;await store.put('playlists',p);closeSheet();render({keepScroll:true});}
          else{const n={id:uid(),name:name,trackIds:[],addedAt:Date.now()};await store.put('playlists',n);PL.set(n.id,n);closeSheet();nav={tab:'playlists',detail:{kind:'playlist',id:n.id}};render();}
        }catch(e){saveErr(e);}
      };
      const del=$('#p-del',b);
      if(del)del.onclick=()=>{closeSheet();confirmSheet({title:'Playlist löschen?',text:'Die Playlist „'+p.name+'“ wird gelöscht. Die Titel bleiben in deiner Bibliothek.',label:'Löschen',onYes:async()=>{PL.delete(p.id);await store.del('playlists',p.id).catch(()=>{});nav={tab:'playlists',detail:null};render();toast('Playlist gelöscht.');}});};
    }});
}
async function addToPlaylist(p,ids){
  const add=ids.filter(i=>!p.trackIds.includes(i));
  if(!add.length){toast('Schon in dieser Playlist.');return;}
  p.trackIds=p.trackIds.concat(add);
  try{await store.put('playlists',p);}catch(e){saveErr(e);return;}
  render({keepScroll:true});toast(add.length===1?'Zu „'+p.name+'“ hinzugefügt.':add.length+' Titel zu „'+p.name+'“ hinzugefügt.');
}
function openAddToPlaylist(ids){
  const pls=[...PL.values()].sort((a,b)=>b.addedAt-a.addedAt);
  openSheet({title:'Zu Playlist hinzufügen',html:'<div class="inline-create"><input class="input" id="pl-new" placeholder="Neue Playlist benennen" maxlength="80" autocomplete="off" aria-label="Name der neuen Playlist"><button class="btn btn-primary" id="pl-create" type="button">Erstellen</button></div>'
    +(pls.length?pls.map(p=>'<button class="row pl" data-pl="'+p.id+'" type="button">'+mosaicHTML(p.trackIds,p.name)+'<div class="meta"><div class="t">'+esc(p.name)+'</div><div class="s">'+p.trackIds.length+' Titel</div></div><span></span></button>').join(''):'<p class="hint">Noch keine Playlists. Gib oben einen Namen ein.</p>'),
    mount:b=>{
      b.addEventListener('click',e=>{const r=e.target.closest('[data-pl]');if(!r)return;const p=PL.get(r.dataset.pl);closeSheet();if(p)addToPlaylist(p,ids);});
      $('#pl-create',b).onclick=async()=>{
        const name=$('#pl-new',b).value.trim();if(!name){toast('Bitte einen Namen eingeben.');return;}
        try{const n={id:uid(),name:name,trackIds:ids.slice(),addedAt:Date.now()};await store.put('playlists',n);PL.set(n.id,n);closeSheet();render({keepScroll:true});toast('Playlist „'+name+'“ erstellt.');}catch(err){saveErr(err);}
      };
    }});
}
function openPlaylistAdd(){
  const p=PL.get(nav.detail.id);if(!p)return;
  const tracks=[...T.values()].filter(t=>!p.trackIds.includes(t.id)).sort((a,b)=>a.title.localeCompare(b.title,'de'));
  if(!tracks.length){toast(T.size?'Alle Titel sind schon in dieser Playlist.':'Lade zuerst Titel hoch.');return;}
  openPicker({title:'Titel hinzufügen',sub:'Zu '+p.name,tracks:tracks,confirm:'Hinzufügen',onDone:ids=>addToPlaylist(p,ids)});
}
async function movePl(p,idx,d){
  const j=idx+d;if(j<0||j>=p.trackIds.length)return;
  const a=p.trackIds;const t=a[idx];a[idx]=a[j];a[j]=t;
  await store.put('playlists',p).catch(()=>{});render({keepScroll:true});
}
async function removeFromPl(p,id){
  p.trackIds=p.trackIds.filter(i=>i!==id);await store.put('playlists',p).catch(()=>{});render({keepScroll:true});toast('Aus der Playlist entfernt.');
}

/* ---------- Wiedergabe ---------- */
const audio=$('#audio');
const PS={queue:[],orig:[],index:-1,shuffle:false,repeat:'off',url:null,curId:null,playing:false};
let seeking=false,lastPos=0,unlocked=false;
const currentTrack=()=>PS.curId?T.get(PS.curId):null;

/* Schaltet das Audio-Element bei der ersten Berührung frei, damit spätere Starts nach dem Laden aus dem Speicher auf iPhones nicht blockiert werden. */
function unlockAudio(){
  if(unlocked||PS.url)return;unlocked=true;
  try{
    audio.src=URL.createObjectURL(new Blob([wavBytes(new Float32Array(800),8000)],{type:'audio/wav'}));
    const p=audio.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
['touchend','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,true));

async function loadAndPlay(id,autoplay){
  if(autoplay===undefined)autoplay=true;
  const t=T.get(id);if(!t)return;
  PS.curId=id;updateNowPlayingUI();
  let rec=null;try{rec=await store.get('audio',id);}catch(e){}
  if(PS.curId!==id)return;
  if(!rec||!rec.buf){toast('Audiodatei nicht gefunden.');return;}
  const url=URL.createObjectURL(new Blob([rec.buf],{type:rec.type||'audio/mpeg'}));
  const old=PS.url;PS.url=url;audio.src=url;if(old)URL.revokeObjectURL(old);
  syncPlay();updateTime();
  if(autoplay){
    try{await audio.play();}
    catch(e){if(e&&e.name==='NotSupportedError')toast('Dieses Format wird auf deinem Gerät nicht unterstützt.');}
  }
}
function startQueue(ids,startId,mode){
  ids=ids.filter(i=>T.has(i));if(!ids.length)return;
  if(mode==='ordered')PS.shuffle=false;
  if(mode==='shuffle')PS.shuffle=true;
  PS.orig=ids.slice();
  if(PS.shuffle){
    const rest=ids.filter(i=>i!==startId);shuffleArr(rest);
    PS.queue=(startId&&ids.includes(startId))?[startId].concat(rest):rest;
    PS.index=0;
  }else{
    PS.queue=ids.slice();PS.index=Math.max(0,PS.queue.indexOf(startId));
  }
  loadAndPlay(PS.queue[PS.index]);
}
function playTrackInContext(id){const ids=ctxIds();startQueue(ids.includes(id)?ids:[id],id,'keep');}
function insertNext(arr,cur,id){const a=arr.filter(i=>i!==id),ci=a.indexOf(cur);a.splice(ci>=0?ci+1:a.length,0,id);return a;}
function playNext(id){
  if(!PS.curId){startQueue([id],id,'keep');return;}
  if(id===PS.curId){toast('Dieser Titel läuft gerade.');return;}
  PS.queue=insertNext(PS.queue,PS.curId,id);PS.orig=insertNext(PS.orig,PS.curId,id);PS.index=PS.queue.indexOf(PS.curId);
  toast('Kommt als Nächstes.');
}
function next(auto){
  if(!PS.queue.length)return;
  if(PS.repeat==='one'&&auto){audio.currentTime=0;const p=audio.play();if(p&&p.catch)p.catch(()=>{});return;}
  let i=PS.index+1;
  if(i>=PS.queue.length){
    if(PS.repeat==='all')i=0;
    else{if(auto){audio.pause();audio.currentTime=0;syncPlay();updateTime();}return;}
  }
  PS.index=i;loadAndPlay(PS.queue[i]);
}
function prev(){
  if(!PS.queue.length)return;
  if(audio.currentTime>3||(PS.index===0&&PS.repeat!=='all')){audio.currentTime=0;return;}
  PS.index=PS.index===0?PS.queue.length-1:PS.index-1;loadAndPlay(PS.queue[PS.index]);
}
function togglePlay(){
  if(!PS.curId)return;
  if(audio.paused){const p=audio.play();if(p&&p.catch)p.catch(()=>{});}else audio.pause();
}
function toggleShuffle(){
  PS.shuffle=!PS.shuffle;const cur=PS.curId;
  if(PS.shuffle){const rest=PS.queue.filter((_,i)=>i!==PS.index);shuffleArr(rest);PS.queue=[cur].concat(rest);PS.index=0;}
  else{const o=PS.orig.filter(i=>T.has(i));if(o.length)PS.queue=o;PS.index=Math.max(0,PS.queue.indexOf(cur));}
  updateControls();
}
function cycleRepeat(){PS.repeat=PS.repeat==='off'?'all':PS.repeat==='all'?'one':'off';updateControls();}
function dropFromQueue(id){
  const qi=PS.queue.indexOf(id);PS.orig=PS.orig.filter(i=>i!==id);
  if(qi>=0){PS.queue.splice(qi,1);if(qi<PS.index)PS.index--;}
  if(PS.curId===id){
    audio.pause();audio.removeAttribute('src');try{audio.load();}catch(e){}
    if(PS.url){URL.revokeObjectURL(PS.url);PS.url=null;}
    PS.curId=null;
    if(PS.queue.length){PS.index=Math.min(Math.max(PS.index,0),PS.queue.length-1);loadAndPlay(PS.queue[PS.index],false);}
    else{PS.index=-1;$('#player').hidden=true;$('#mini').hidden=true;syncPlay();}
  }
}

function syncPlay(){
  PS.playing=!!PS.url&&audio.src===PS.url&&!audio.paused;
  updateControls();
}
function updateControls(){
  const pi=PS.playing?'pause':'play';
  $('#mini-play').innerHTML=icon(pi,22);
  $('#pl-play').innerHTML=icon(pi,32);
  const sh=$('#pl-shuffle'),rp=$('#pl-repeat');
  sh.classList.toggle('on',PS.shuffle);sh.setAttribute('aria-pressed',PS.shuffle?'true':'false');sh.innerHTML=icon('shuffle',24);
  rp.classList.toggle('on',PS.repeat!=='off');rp.setAttribute('aria-pressed',PS.repeat!=='off'?'true':'false');rp.innerHTML=icon(PS.repeat==='one'?'repeat1':'repeat',24);
  rp.setAttribute('aria-label',PS.repeat==='off'?'Wiederholen aus':PS.repeat==='all'?'Alle wiederholen':'Titel wiederholen');
  $('#player').classList.toggle('is-playing',PS.playing);
  document.body.classList.toggle('is-paused',!PS.playing);
  if('mediaSession' in navigator){try{navigator.mediaSession.playbackState=PS.playing?'playing':'paused';}catch(e){}}
}
function updatePlayingMarks(){
  document.querySelectorAll('[data-track]').forEach(el=>el.classList.toggle('playing',el.dataset.track===PS.curId));
}
function updateNowPlayingUI(){
  const t=currentTrack(),mini=$('#mini');
  if(!t){mini.hidden=true;updatePlayingMarks();return;}
  const an=artistName(t),hue=hueOf(t);
  mini.hidden=false;
  $('#mini-cover').innerHTML=coverHTML(t);
  $('#mini-title').textContent=t.title;$('#mini-artist').textContent=an||'Kein Künstler';
  const pl=$('#player');pl.style.setProperty('--h',hue);
  const sl=$('#pl-sleeve');sl.style.cssText=coverStyle(t);sl.textContent=t.cover?'':initial(t.title);
  $('#pl-title').textContent=t.title;
  const pa=$('#pl-artist');pa.textContent=an||'Kein Künstler';
  if(t.artistId)pa.dataset.id=t.artistId;else delete pa.dataset.id;
  $('#pl-disc').style.setProperty('--h',hue);
  updateControls();updatePlayingMarks();updateTime();setMediaSession(t);
}
function updateTime(){
  const d=audio.duration,t=currentTrack();
  const dur=(PS.url&&audio.src===PS.url&&isFinite(d)&&d>0)?d:(t&&t.duration)||0;
  const c=(PS.url&&audio.src===PS.url)?(audio.currentTime||0):0;
  const p=dur?Math.min(100,c/dur*100):0;
  $('#mini').style.setProperty('--pp',p+'%');
  const seek=$('#seek');
  if(!seeking){seek.max=dur||0;seek.value=c;seek.style.setProperty('--p',p+'%');$('#t-cur').textContent=fmt(c);}
  $('#t-dur').textContent=fmt(dur);
}
const seekEl=$('#seek');
seekEl.addEventListener('input',()=>{seeking=true;const v=+seekEl.value,m=+seekEl.max||1;seekEl.style.setProperty('--p',(v/m*100)+'%');$('#t-cur').textContent=fmt(v);});
seekEl.addEventListener('change',()=>{if(PS.url&&audio.src===PS.url)audio.currentTime=+seekEl.value;seeking=false;});

audio.addEventListener('play',syncPlay);
audio.addEventListener('pause',syncPlay);
audio.addEventListener('timeupdate',()=>{
  if(audio.src!==PS.url)return;
  updateTime();
  const now=Date.now();
  if(now-lastPos>1000&&'mediaSession' in navigator&&isFinite(audio.duration)&&audio.duration>0){lastPos=now;try{navigator.mediaSession.setPositionState({duration:audio.duration,position:Math.min(audio.currentTime,audio.duration),playbackRate:1});}catch(e){}}
});
audio.addEventListener('loadedmetadata',()=>{
  if(audio.src!==PS.url)return;
  const t=currentTrack();
  if(t&&isFinite(audio.duration)&&audio.duration>0&&(!t.duration||Math.abs(t.duration-audio.duration)>1)){t.duration=audio.duration;store.put('tracks',t).catch(()=>{});}
  updateTime();
});
audio.addEventListener('ended',()=>{if(audio.src!==PS.url)return;next(true);});
audio.addEventListener('error',()=>{if(PS.url&&audio.src===PS.url)toast('Diese Datei lässt sich nicht abspielen.');});

function setMediaSession(t){
  if(!('mediaSession' in navigator)||!t)return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:artistName(t),album:t.album||'Plattenkiste',artwork:t.cover?[{src:t.cover,sizes:'320x320',type:'image/jpeg'}]:[]});}catch(e){}
}
function initMediaSession(){
  if(!('mediaSession' in navigator))return;
  const set=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f);}catch(e){}};
  set('play',()=>{const p=audio.play();if(p&&p.catch)p.catch(()=>{});});
  set('pause',()=>audio.pause());
  set('previoustrack',prev);set('nexttrack',()=>next(false));
  set('seekto',d=>{if(d&&d.seekTime!=null)audio.currentTime=d.seekTime;});
  set('seekbackward',()=>{audio.currentTime=Math.max(0,audio.currentTime-10);});
  set('seekforward',()=>{audio.currentTime=audio.currentTime+10;});
}

/* ---------- Player-Overlay, Ausgabe ---------- */
function openPlayer(){if(!PS.curId)return;$('#player').hidden=false;updateNowPlayingUI();}
function closePlayer(){$('#player').hidden=true;}
function openOutput(){
  const canPick=typeof audio.webkitShowPlaybackTargetPicker==='function';
  openSheet({title:'Bluetooth und Ausgabe',html:'<div class="form"><p class="body-p">Das Koppeln übernimmt dein Handy oder Computer. Sobald ein Bluetooth-Gerät verbunden ist, läuft die Musik automatisch darüber.</p>'
    +'<ol class="steps"><li>Bluetooth in den Geräte-Einstellungen einschalten.</li><li>Kopfhörer, Lautsprecher oder Auto koppeln.</li><li>Hier einen Titel abspielen. Die Tasten am Gerät steuern Play, Pause und Weiter.</li></ol>'
    +(canPick?'<button class="btn btn-primary wide" id="o-pick" type="button">'+icon('bt',18)+' Ausgabegerät wählen</button>':'')+'</div>',
    mount:b=>{const pk=$('#o-pick',b);if(pk)pk.onclick=()=>{try{audio.webkitShowPlaybackTargetPicker();}catch(e){toast('Die Geräteauswahl ist hier nicht verfügbar.');}};}});
}

/* ---------- Aktionen ---------- */
const actions={
  tab(id,el){nav={tab:el.dataset.tab,detail:null};query='';render();},
  back(){nav.detail=null;render();},
  'open-artist'(id){nav.detail={kind:'artist',id:id};render();},
  'open-playlist'(id){nav.detail={kind:'playlist',id:id};render();},
  'play-track'(id){playTrackInContext(id);},
  'track-menu'(id){openTrackMenu(id);},
  'play-all'(){startQueue(ctxIds(),null,'ordered');},
  'shuffle-all'(){startQueue(ctxIds(),null,'shuffle');},
  'toggle-sort'(){sortMode=sortMode==='new'?'az':'new';render({keepScroll:true});},
  'upload-open'(){openUpload();},
  'artist-new'(){openArtistForm();},
  'artist-edit'(){openArtistForm(nav.detail.id);},
  'artist-assign'(){openAssign();},
  'playlist-new'(){openPlaylistForm();},
  'playlist-edit'(){openPlaylistForm(nav.detail.id);},
  'playlist-add'(){openPlaylistAdd();},
  'demo-remove'(){removeDemos();},
  'mini-open'(){openPlayer();},
  'player-close'(){closePlayer();},
  'p-toggle'(){togglePlay();},
  'p-prev'(){prev();},
  'p-next'(){next(false);},
  'p-shuffle'(){toggleShuffle();},
  'p-repeat'(){cycleRepeat();},
  'p-artist'(id){if(!id)return;closePlayer();nav={tab:'artists',detail:{kind:'artist',id:id}};render();},
  'p-addpl'(){if(PS.curId)openAddToPlaylist([PS.curId]);},
  'p-output'(){openOutput();},
  'sheet-close'(){closeSheet();}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const h=actions[el.dataset.action];if(h)h(el.dataset.id,el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!sheetEl.hidden)closeSheet();else if(!$('#player').hidden)closePlayer();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.row[role="button"]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){
    query=e.target.value;const list=visibleTracks();
    $('#list').innerHTML=listHTML(list);$('#count').textContent=countText(list);updatePlayingMarks();
  }
});

/* ---------- Start ---------- */
async function boot(){
  initMediaSession();
  $('[data-action="player-close"]').innerHTML=icon('down',26);
  $('.pl-top [data-action="p-output"]').innerHTML=icon('bt',22);
  $('#pl-prev').innerHTML=icon('prev',28);
  $('#pl-next').innerHTML=icon('next',28);
  $('#pl-add').innerHTML=icon('plus',24);
  $('#pl-out').innerHTML=icon('bt',18)+' Bluetooth und Ausgabe';
  try{idb=await openDB();}catch(e){memMode=true;}
  try{
    const r=await Promise.all([store.all('tracks'),store.all('artists'),store.all('playlists')]);
    r[0].forEach(t=>T.set(t.id,t));r[1].forEach(a=>A.set(a.id,a));r[2].forEach(p=>PL.set(p.id,p));
  }catch(e){memMode=true;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  try{
    const seeded=await store.get('meta','seeded');
    if(!seeded&&T.size===0)await seedDemo();
  }catch(e){}
  render();updateControls();
}
boot();
})();
